# Donation box settings — used by _includes/donate.html
# Leave a value blank ("") to hide that option.
# Hide the box on one page with `donate: false` in that page's front matter.

enabled: true
heading: "Support this work"
blurb: "Found this useful? A small donation helps it continue."

# Stripe Payment Link with "Customers choose what to pay" (one-off)
stripe: "https://buy.stripe.com/fZu5kC6PS3L3cA2bQVafS00"

# PayPal.me link or PayPal Donate button URL
paypal: "https://www.paypal.com/ncp/payment/75P7FNYNHJ3AJ"

